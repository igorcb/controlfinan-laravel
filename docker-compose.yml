services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_laravel
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DB_HOST: db
    ports:
      - "8002:8000"
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  db_data:
